<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- FONT LINK: paste the kit's Google Fonts <link> on the next line -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* BRAND TOKENS: replace this whole :root block with the kit's CSS tokens */
:root {
  --bg: #F6F8FC; --card: #FFFFFF; --card-border: #E1E8F3; --text: #0B1B33; --muted: #5B6B85;
  --primary: #004AAD; --accent: #1D7AD0; --on-primary: #FFFFFF;
  --pattern: rgba(0, 74, 173, .09); --deco: #D3DDEC;
  --font-heading: 'Poppins', sans-serif; --font-body: 'Inter', sans-serif;
  --shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}
/* ---------- base: keep ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { --w: 1080px; --h: 1350px; width: var(--w); height: var(--h); overflow: hidden; }
body.square { --h: 1080px; }
.slide { position: relative; width: var(--w); height: var(--h); background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }
.slide::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  -webkit-mask-image: linear-gradient(160deg, rgba(0,0,0,.95), rgba(0,0,0,.5) 50%, rgba(0,0,0,.95));
          mask-image: linear-gradient(160deg, rgba(0,0,0,.95), rgba(0,0,0,.5) 50%, rgba(0,0,0,.95)); }
.slide[data-pattern="grid"]::before { background-image: linear-gradient(var(--pattern) 1px, transparent 1px), linear-gradient(90deg, var(--pattern) 1px, transparent 1px); background-size: 44px 44px; }
.slide[data-pattern="dots"]::before { background-image: radial-gradient(var(--pattern) 2.2px, transparent 2.6px); background-size: 30px 30px; }
.slide[data-pattern="lines"]::before { background-image: repeating-linear-gradient(45deg, var(--pattern) 0 1px, transparent 1px 24px); }
.deco { position: absolute; border: 3px solid var(--deco); transform: rotate(32deg); pointer-events: none; }
.slide[data-pattern="shapes"] .deco { border-radius: 50%; transform: none; }
.inner { position: relative; padding: 90px; height: 100%; display: flex; flex-direction: column; gap: 44px; }
.framed { position: relative; margin: 26px 0; }
.framed > .outline { position: absolute; inset: -26px; border: 2px solid var(--accent); border-radius: 36px; pointer-events: none; }
.card { position: relative; background: var(--card); border: 1px solid var(--card-border); border-radius: 26px; box-shadow: var(--shadow); }
.k { color: var(--primary); }
.pill { display: inline-block; flex: none; background: var(--primary); color: var(--on-primary); font-family: var(--font-heading); font-weight: 700; font-size: 28px; line-height: 1; padding: 12px 20px; border-radius: 999px; min-width: 78px; text-align: center; }
.pbar { display: flex; align-items: center; gap: 20px; }
.pbar .photo { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 4px solid var(--card); box-shadow: 0 0 0 3px var(--accent), var(--shadow); background: var(--primary); }
.pbar b { display: block; font-family: var(--font-heading); font-weight: 700; font-size: 32px; }
.pbar span { display: block; font-size: 26px; color: var(--muted); }
/* ---------- this layout ---------- */
.label { font-size: 26px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--font-heading); font-weight: 800; font-size: 130px; line-height: 1; }
.big .pill { font-size: 130px; padding: 14px 40px 22px; min-width: 0; border-radius: 40px; }
.line { font-family: var(--font-heading); font-weight: 700; font-size: 52px; line-height: 1.15; }
.photo-card { padding: 16px; }
.photo-card img, .photo-card .ph { display: block; width: 100%; height: 330px; object-fit: cover; object-position: 50% 30%; border-radius: 16px; background: var(--card-border); }
.timeline { display: flex; gap: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 30px; right: 30px; top: 30px; height: 3px; background: var(--accent); opacity: .45; }
.step { flex: 1; position: relative; display: flex; flex-direction: column; gap: 14px; }
.dot { width: 60px; height: 60px; border-radius: 50%; background: var(--card); border: 3px solid var(--accent); display: grid; place-items: center; font-family: var(--font-heading); font-weight: 700; font-size: 26px; color: var(--primary); box-shadow: var(--shadow); }
.step b { font-family: var(--font-heading); font-weight: 700; font-size: 32px; }
.step span { font-size: 26px; color: var(--muted); line-height: 1.3; padding-right: 20px; }
.foot { margin-top: auto; flex: none; }
.inner { gap: 38px; }
body.square .big, body.square .big .pill { font-size: 104px; }
body.square .inner { gap: 24px; }
body.square .label { display: none; }
body.square .photo-card img, body.square .photo-card .ph { height: 150px; }
</style>
</head>
<body>
<div class="slide" data-pattern="grid">
  <div class="deco" style="width:220px;height:220px;left:-95px;top:-75px"></div>
  <div class="deco" style="width:110px;height:110px;left:120px;top:-55px"></div>
  <div class="deco" style="width:240px;height:240px;right:-105px;bottom:-95px"></div>
  <div class="deco" style="width:110px;height:110px;right:140px;bottom:-55px"></div>
  <div class="inner">
    <div class="label">{{LABEL}}</div>
    <div class="big"><span class="pill">{{BIG_NUMBER_OR_DATE}}</span></div>
    <div class="line">{{ONE_LINE_START}} <span class="k">{{KEY_WORDS}}</span></div>
    <!-- OPTIONAL PHOTO: delete this block if there is no photo -->
    <div class="framed">
      <div class="outline"></div>
      <div class="card photo-card"><div class="ph"></div><!-- <img src="photo.jpg"> --></div>
    </div>
    <div class="timeline">
      <div class="step"><div class="dot">1</div><b>{{STEP_1_WHEN}}</b><span>{{STEP_1_WHAT}}</span></div>
      <div class="step"><div class="dot">2</div><b>{{STEP_2_WHEN}}</b><span>{{STEP_2_WHAT}}</span></div>
      <div class="step"><div class="dot">3</div><b>{{STEP_3_WHEN}}</b><span>{{STEP_3_WHAT}}</span></div>
    </div>
    <div class="pbar foot">
      <div class="photo"></div>
      <div><b>{{NAME}}</b></div>
    </div>
  </div>
</div>
</body>
</html>
